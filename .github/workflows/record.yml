name: TS Stream Recorder

on:
  workflow_dispatch:
    inputs:
      stream_url:
        description: "Direct raw MPEG-TS stream URL (.ts or compatible live endpoint)"
        required: true
        type: string
      part_size_gb:
        description: "Split size in GiB"
        required: true
        default: "4"
        type: choice
        options: ["1", "2", "3", "4", "5", "6", "8"]
      max_runtime_minutes:
        description: "Maximum recording runtime"
        required: true
        default: "350"
        type: choice
        options: ["30", "60", "90", "120", "180", "240", "300", "350"]
      auto_reconnect:
        description: "Reconnect after stream disconnects"
        required: true
        default: true
        type: boolean
      upload_to_gofile:
        description: "Upload completed parts to Gofile"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ts-recorder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STREAM_URL: ${{ inputs.stream_url }}
      PART_SIZE_GB: ${{ inputs.part_size_gb }}
      MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}
      AUTO_RECONNECT: ${{ inputs.auto_reconnect }}
      UPLOAD_TO_GOFILE: ${{ inputs.upload_to_gofile }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CONNECT_TIMEOUT_SECONDS: "20"
      READ_TIMEOUT_SECONDS: "90"
      MAX_RECONNECTS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Run recorder
        run: python -u gh_record.py
      - name: Upload local recordings as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-recordings-${{ github.run_id }}
          path: recordings/*.ts
          if-no-files-found: ignore
          retention-days: 3
      - name: Save recorder log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-log-${{ github.run_id }}
          path: recorder.log
          if-no-files-found: ignore
          retention-days: 7
